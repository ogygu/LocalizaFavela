<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triagem de inscrições — Painel da ONG</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html"><svg class="pin" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Localiza<em>Favela</em></a>
      <nav class="nav-desktop"><a href="projetos.html">Meus projetos</a><button type="button" class="btn btn-secondary btn-sm" id="btnSair">Sair</button></nav>
    </div>
  </header>

  <main id="conteudo" class="container">
    <div class="dash-shell">
      <aside class="dash-side"><nav class="side-nav" aria-label="Menu da ONG">
        <a href="dashboard.html">🏠 Visão geral</a>
        <a href="projetos.html">📣 Meus projetos</a>
        <a href="triagem.html" aria-current="page">🗂️ Triagem de inscrições</a>
        <a href="galeria.html">🖼️ Galeria de fotos</a>
        <a href="perfil_ong.html">🏢 Perfil da ONG</a>
      </nav></aside>

      <section class="dash-main">
        <h1 class="section-title" style="font-size:var(--fs-xl)">Triagem de inscrições</h1>
        <p class="lead" style="font-size:var(--fs-sm);margin-bottom:var(--sp-5)">Analise cada candidato e escreva um parecer — ele é enviado ao cidadão. Nada fica sem resposta.</p>

        <div class="filter-bar" style="margin-bottom:var(--sp-5)">
          <div class="field" style="margin:0">
            <label for="tProjeto">Projeto</label>
            <select class="select" id="tProjeto"><option value="">Todos</option></select>
          </div>
          <div class="field" style="margin:0">
            <label for="tStatus">Status</label>
            <select class="select" id="tStatus">
              <option value="">Todos</option>
              <option value="pendente">Em análise</option>
              <option value="aprovado">Aprovados</option>
              <option value="rejeitado">Não selecionados</option>
            </select>
          </div>
        </div>

        <div id="listaTriagem" style="display:flex;flex-direction:column;gap:var(--sp-4)">
          <div class="skeleton" style="height:110px"></div>
          <div class="skeleton" style="height:110px"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- MODAL DE DECISÃO -->
  <div class="modal-backdrop" id="modalDecisao" role="dialog" aria-modal="true" aria-labelledby="decTitulo">
    <div class="modal">
      <div class="modal-head">
        <h2 id="decTitulo" style="font-size:var(--fs-lg)">Decisão</h2>
        <button type="button" class="modal-close" id="decFechar" aria-label="Fechar">×</button>
      </div>
      <div id="decCorpo"></div>
    </div>
  </div>

  <script src="../js/config/supabase.js"></script>
  <script type="module" src="../js/pages/triagem.js"></script>
</body>
</html>
