<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — LocalizaFavela</title>
  <meta name="description" content="Acesse o LocalizaFavela: usuários entram com CPF, ONGs com CPF/CNPJ." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />

  <!-- Pin fixo: a build mais nova do supabase-js injeta um token de captcha que,
     sem provider de captcha configurado no projeto, faz o signUp falhar com erros
     confusos ("rate limit"/500). 2.54.0 é a última UMD estável e testada. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.54.0/dist/umd/supabase.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="LocalizaFavela — página inicial">
        <svg class="pin" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
        </svg>
        Localiza<em>Favela</em>
      </a>
      <nav class="nav-desktop" aria-label="Navegação principal">
        <a href="cadastro.html">Criar conta</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="auth-shell">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Bem-vindo(a) de volta</h1>
        <p class="lead" style="font-size:var(--fs-sm)">Entre para continuar conectando sua comunidade.</p>

        <!-- Segmented control: fluxo Usuário (CPF) | ONG (CPF/CNPJ) -->
        <div class="segmented" role="group" aria-label="Tipo de conta">
          <button type="button" id="tabUsuario" aria-pressed="true">Usuário</button>
          <button type="button" id="TabOng" aria-pressed="false">ONG</button>
        </div>
      </div>

      <div class="form-feedback" id="loginErro" role="alert"></div>

      <form id="formLogin" novalidate>
        <div class="field">
          <label for="documento" id="labelDocumento">CPF</label>
          <input class="input" type="text" id="documento" name="documento"
                 inputmode="numeric" autocomplete="username"
                 placeholder="000.000.000-00" required />
          <span class="hint" id="hintDocumento">Você também pode entrar com o e-mail cadastrado.</span>
          <span class="error-msg">Documento inválido.</span>
        </div>

        <div class="field">
          <label for="senha">Senha</label>
          <div class="senha-wrap">
            <input class="input" type="password" id="senha" name="senha"
                   autocomplete="current-password" placeholder="••••••••" required />
            <button type="button" class="senha-toggle" id="verSenha" aria-label="Mostrar senha">mostrar</button>
          </div>
          <span class="error-msg">Informe sua senha.</span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnEntrar">Entrar</button>
      </form>

      <p class="auth-alt">
        Ainda não tem conta?
        <a href="cadastro.html">Cadastre-se gratuitamente</a>
      </p>
    </div>
  </main>

  <script src="js/config/supabase.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
