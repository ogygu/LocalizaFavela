<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minhas inscrições — LocalizaFavela</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/reset.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/pages.css" />
  <!-- Pin fixo: a build mais nova do supabase-js injeta um token de captcha que,
     sem provider de captcha configurado no projeto, faz o signUp falhar com erros
     confusos ("rate limit"/500). 2.54.0 é a última UMD estável e testada. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.54.0/dist/umd/supabase.js"></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="../index.html"><svg class="pin" width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Localiza<em>Favela</em></a>
      <nav class="nav-desktop"><a href="projetos.html">Explorar projetos</a><button type="button" class="btn btn-secondary btn-sm" id="btnSair">Sair</button></nav>
    </div>
  </header>

  <main id="conteudo" class="container">
    <div class="dash-shell">
      <aside class="dash-side"><nav class="side-nav" aria-label="Menu do painel">
        <a href="dashboard.html">🏠 Início</a>
        <a href="projetos.html">📍 Projetos perto de mim</a>
        <a href="inscricoes.html" aria-current="page">📋 Minhas inscrições</a>
        <a href="perfil.html">🙂 Meu perfil</a>
      </nav></aside>

      <section class="dash-main">
        <div class="section-head">
          <h1 class="section-title" style="font-size:var(--fs-xl)">Minhas inscrições</h1>
          <p class="lead" style="font-size:var(--fs-sm)">Histórico completo: status do processo seletivo e parecer das ONGs.</p>
        </div>

        <div class="segmented" role="group" aria-label="Filtrar por status" style="margin-bottom:var(--sp-5)">
          <button type="button" data-filtro="" aria-pressed="true">Todas</button>
          <button type="button" data-filtro="pendente" aria-pressed="false">Em análise</button>
          <button type="button" data-filtro="aprovado" aria-pressed="false">Aprovadas</button>
          <button type="button" data-filtro="rejeitado" aria-pressed="false">Não selecionadas</button>
        </div>

        <div id="listaInscricoes" style="display:flex;flex-direction:column;gap:var(--sp-3)">
          <div class="skeleton" style="height:80px"></div>
          <div class="skeleton" style="height:80px"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="../js/config/supabase.js"></script>
  <script type="module" src="../js/pages/inscricoes.js"></script>
</body>
</html>
